services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epiassist_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cosmonet
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  python:
    build: ../EPIAssist-v2_service
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:cosmonet@db:5432/epiassist_db
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/epiassist_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: cosmonet
      PYTHON_SERVICE_URL: http://python:8000
    depends_on:
      db:
        condition: service_healthy
      python:
        condition: service_started

volumes:
  pgdata:
